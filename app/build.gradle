plugins {
    id 'com.android.application' version '8.9.3'
}
android {
    namespace 'org.nightreminder'
    compileSdk 35
    defaultConfig {
        applicationId 'org.nightreminder'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.1.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
